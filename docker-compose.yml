# Starts only PostgreSQL for local development (bonus task).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety
      POSTGRES_DB: sweety
    ports:
      - "5432:5432"
    volumes:
      - sweety-data:/var/lib/postgresql/data
volumes:
  sweety-data:
