# Starts only PostgreSQL for local development 
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: <-YOUR-PASSWORD->
      POSTGRES_DB: sweety
    ports:
      - "5433:5432"
    volumes:
      - sweety-data:/var/lib/postgresql/data
volumes:
  sweety-data:
